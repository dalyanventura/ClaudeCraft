# Bloque une pull request qui ajoute ou met à jour une dépendance vulnérable
# (gravité moyenne ou plus) ou sous une licence incompatible.
name: Revue des dépendances

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Revue des dépendances
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # commentaire de résumé sur la PR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: on-failure
