<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>ClaudeCraft</title>
  <link rel="stylesheet" href="../../node_modules/@xterm/xterm/css/xterm.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="titlebar">
    <button id="btn-sidebar" class="icon" title="Afficher/masquer la liste des projets">☰</button>
    <span class="brand"><span class="gem">◆</span> ClaudeCraft</span>
    <span id="hotkey-hint" class="hint"></span>
    <div class="spacer"></div>
    <label class="opacity" title="Opacité de la fenêtre">◐ <input id="opacity" type="range" min="40" max="100"></label>
    <button id="btn-wow-only" class="icon" title="">🎮</button>
    <button id="btn-sound" class="icon" title="Signal sonore activé/désactivé">🔔</button>
    <button id="btn-test-sound" class="icon" title="Tester le son">♪</button>
    <button id="btn-hide" class="icon" title="Réduire en bouton flottant">—</button>
    <button id="btn-quit" class="icon danger" title="Quitter ClaudeCraft">✕</button>
  </header>

  <div id="main">
    <aside id="sidebar">
      <div class="side-actions">
        <button id="btn-new-project" class="primary">+ Nouveau projet</button>
        <button id="btn-open-folder">📂 Ouvrir un dossier…</button>
      </div>
      <div class="side-header">
        <span>Projets &amp; sessions</span>
        <button id="btn-refresh" class="icon small" title="Actualiser">⟳</button>
      </div>
      <input id="filter" type="search" placeholder="Filtrer…" spellcheck="false">
      <div id="projects"></div>
    </aside>

    <section id="workspace">
      <nav id="tabs"></nav>
      <div id="terminals">
        <div id="empty">
          <div class="empty-title">Aucune session ouverte</div>
          <p>Choisissez une session à gauche pour la <b>reprendre</b>, ou créez un <b>nouveau projet</b>.</p>
          <p class="muted">Raccourci pour afficher/masquer cette fenêtre en jeu : <kbd id="hotkey-empty"></kbd></p>
          <p class="muted">Un signal sonore retentit quand Claude a fini et attend votre réponse.</p>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" hidden></div>

  <dialog id="dlg-new">
    <form method="dialog">
      <h3>Nouveau projet</h3>
      <label>Nom du projet<input id="new-name" required autocomplete="off" spellcheck="false"></label>
      <p class="muted small">Créé dans <span id="projects-dir"></span></p>
      <menu>
        <button value="cancel" formnovalidate>Annuler</button>
        <button value="ok" class="primary">Créer et lancer Claude</button>
      </menu>
    </form>
  </dialog>

  <script src="../../node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="../../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="utils.js"></script>
  <script src="sounds.js"></script>
  <script src="app.js"></script>
</body>
</html>
